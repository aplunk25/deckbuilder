version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
  exclusions:
    presets:
      - std-error-handling # e.g. unchecked `defer resp.Body.Close()`
  settings:
    misspell:
      locale: US
      ignore-rules:
        - flavour # field name from the API
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
